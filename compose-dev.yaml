include:
  - compose-base.yaml

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-airflow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-airflow}
      POSTGRES_MULTIPLE_DB: airflow, keycloak, bluecore
    ports:
      - ${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./scripts/init-multi-postgres-dbs.sh:/docker-entrypoint-initdb.d/init-multi-postgres-dbs.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USERNAME:-airflow}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.1.2}
    expose:
      - 8080
      - 8443
    env_file:
      - ./.env
    environment:
      # Keycloak's DB connection is derived from the shared DATABASE_* vars
      KC_DB_URL: jdbc:postgresql://${DATABASE_HOSTNAME:-postgres}:${DATABASE_PORT:-5432}/keycloak
      KC_DB_USERNAME: ${DATABASE_USERNAME:-airflow}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD:-airflow}
    command:
      - start-dev
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<> /dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: http://localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi;" ]
      interval: 10s
      timeout: 10s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  # Development and CI only. Seeds the five test accounts with every managed
  # policy set to no-delete, so it can only add. Absent from compose.yaml, so
  # staging and production never receive repo-declared users.
  keycloak-config-users:
    image: ${KEYCLOAK_CONFIG_CLI_IMAGE:-adorsys/keycloak-config-cli:6.5.1-26.1.0}
    env_file:
      - ./.env
    environment:
      KEYCLOAK_URL: http://keycloak:8080/keycloak/
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_VAR_SUBSTITUTION_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/bluecore-dev-users.yaml
      IMPORT_MANAGED_CLIENT: no-delete
      IMPORT_MANAGED_ROLE: no-delete
      IMPORT_MANAGED_CLIENT_SCOPE: no-delete
      IMPORT_MANAGED_SCOPE_MAPPING: no-delete
      IMPORT_MANAGED_CLIENT_SCOPE_MAPPING: no-delete
      IMPORT_MANAGED_COMPONENT: no-delete
      IMPORT_MANAGED_SUB_COMPONENT: no-delete
      IMPORT_MANAGED_AUTHENTICATION_FLOW: no-delete
      IMPORT_MANAGED_REQUIRED_ACTION: no-delete
      IMPORT_MANAGED_IDENTITY_PROVIDER: no-delete
      IMPORT_MANAGED_IDENTITY_PROVIDER_MAPPER: no-delete
      IMPORT_MANAGED_GROUP: no-delete
      IMPORT_MANAGED_SUB_GROUP: no-delete
      IMPORT_MANAGED_CLIENT_AUTHORIZATION_RESOURCES: no-delete
      IMPORT_MANAGED_CLIENT_AUTHORIZATION_POLICIES: no-delete
      IMPORT_MANAGED_CLIENT_AUTHORIZATION_SCOPES: no-delete
      IMPORT_MANAGED_MESSAGE_BUNDLES: no-delete
      IMPORT_MANAGED_ORGANIZATION: no-delete
      IMPORT_MANAGED_WORKFLOW: no-delete
    volumes:
      - ./keycloak/realm:/config:ro
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
    restart: "no"

  nginx:
    image: nginx:1.27.4-alpine
    ports:
      - "80:80"
    depends_on:
      - bc_api
      - keycloak
      - airflow-apiserver
    volumes:
      - ./nginx/base.conf:/etc/nginx/conf.d/default.conf
      # Outside conf.d/ on purpose: base.conf includes it from inside its
      # server block, and conf.d/*.conf is loaded at http context.
      - ./nginx/site-body.conf:/etc/nginx/site-body.conf
      - ./nginx/local.conf:/etc/nginx/conf.d/env/server.conf
      - ./nginx:/var/www/html
    restart: always

volumes:
  postgres-db-volume:
