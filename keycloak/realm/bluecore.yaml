---
# Declarative configuration for the `bluecore` Keycloak realm.
#
# Applied by keycloak-config-cli (adorsys/keycloak-config-cli:6.5.1-26.1.0).
# This file is the single source of truth for the realm: edit it, commit it, and
# let the importer converge the running Keycloak. Do NOT hand-edit the realm in
# the admin console -- `scripts/keycloak/verify-realm.sh` proves this file
# reproduces the realm exactly, and console edits show up as drift.
#
# Variables (supplied via .env / the compose importer service):
#   KEYCLOAK_SSL_REQUIRED            - realm sslRequired ("external" locally)
#   KEYCLOAK_PUBLIC_BASE_URL         - public origin, no trailing slash
#                                      (e.g. "http://localhost")
#   AIRFLOW_KEYCLOAK_CLIENT_SECRET   - bluecore_workflows confidential secret
#
# IMPORT_VAR_SUBSTITUTION_ENABLED=true is REQUIRED; it is false upstream and
# templating silently no-ops without it.
#
# Deliberately NOT declared here (Keycloak creates them itself on any realm, so
# declaring them would only pin values that Keycloak already owns):
#   - the realm `id` and any `containerId` (generated UUIDs)
#   - the default clients (account, account-console, admin-cli, broker,
#     realm-management, security-admin-console) and their client roles
#   - the 14 default client scopes
#   - bluecore_workflows' `uma_protection` role (generated by
#     authorizationServicesEnabled: true)
# Users are NOT declared here either -- see keycloak/realm/*-users.yaml.
realm: "bluecore"
enabled: true
sslRequired: "$(env:KEYCLOAK_SSL_REQUIRED)"
registrationAllowed: false
resetPasswordAllowed: false
accessTokenLifespan: 300

attributes:
  oauth2DeviceCodeLifespan: "600"
  oauth2DevicePollingInterval: "5"
  clientSessionIdleTimeout: "0"
  clientSessionMaxLifespan: "0"
  clientOfflineSessionIdleTimeout: "0"
  clientOfflineSessionMaxLifespan: "0"

# Browser security headers, carried over verbatim from the pre-migration realm
# export (now frozen at tests/fixtures/keycloak/bluecore-realm-pre-migration.json).
# These are Keycloak's own defaults, so the realm gets them whether or not we
# declare them -- Keycloak treats an absent or empty map as "keep defaults" and
# will not clear them. They are declared here anyway for two reasons:
#
#   1. They are load-bearing security settings (clickjacking, CSP, HSTS,
#      MIME-sniffing and XSS protections). Pinning them explicitly means a
#      change to them shows up as a reviewable diff instead of silently
#      inheriting whatever a future Keycloak version defaults to.
#   2. Declaring them keeps this field byte-identical to normalize's reference
#      realm, so it stops surfacing as `browserSecurityHeaders: {}` noise in
#      equivalence and drift diffs.
#
# contentSecurityPolicyReportOnly is legitimately "" upstream; every other
# header here must be non-empty. scripts/keycloak/lib.sh asserts exactly that.
#
# NOTE: do NOT "simplify" this to `browserSecurityHeaders: {}`. An empty map
# reads as "no security headers configured" to anyone reviewing this file, and
# would become a real regression the day Keycloak starts honouring it literally.
browserSecurityHeaders:
  contentSecurityPolicyReportOnly: ""
  xContentTypeOptions: "nosniff"
  referrerPolicy: "no-referrer"
  xRobotsTag: "none"
  xFrameOptions: "SAMEORIGIN"
  contentSecurityPolicy: "frame-src 'self'; frame-ancestors 'self'; object-src 'none';"
  xXSSProtection: "1; mode=block"
  strictTransportSecurity: "max-age=31536000; includeSubDomains"

roles:
  realm:
    - name: "create"
      description: ""
      composite: false
      clientRole: false
    - name: "update"
      description: ""
      composite: false
      clientRole: false
    - name: "default-roles-bluecore"
      description: "${role_default-roles}"
      composite: true
      composites:
        realm:
          - "offline_access"
          - "uma_authorization"
        client:
          account:
            - "manage-account"
            - "view-profile"
      clientRole: false
    - name: "export"
      description: ""
      composite: false
      clientRole: false
  client:
    bluecore_workflows:
      - name: "SuperAdmin"
        description: "Airflow super-admin role for Keycloak auth manager bootstrap"
        composite: false
        clientRole: true
      - name: "Op"
        description: "Op permissions"
        composite: false
        clientRole: true
      - name: "update"
        description: ""
        composite: false
        clientRole: true
      - name: "Admin"
        description: ""
        composite: false
        clientRole: true
      - name: "Viewer"
        description: "Viewer permissions"
        composite: false
        clientRole: true
      - name: "User"
        description: "User permissions"
        composite: false
        clientRole: true
      - name: "Public"
        description: "Pubic permissions"
        composite: false
        clientRole: true
      - name: "create"
        description: ""
        composite: false
        clientRole: true

clients:
  - clientId: "bluecore_workflows"
    name: "Bluecore Workflows"
    description: "For Airflow"
    enabled: true
    protocol: "openid-connect"
    secret: "$(env:AIRFLOW_KEYCLOAK_CLIENT_SECRET)"
    rootUrl: ""
    baseUrl: ""
    adminUrl: ""
    redirectUris:
      - "$(env:KEYCLOAK_PUBLIC_BASE_URL)/workflows/auth/login_callback"
      - "$(env:KEYCLOAK_PUBLIC_BASE_URL)/workflows/auth/oauth-authorized/keycloak"
      - "$(env:KEYCLOAK_PUBLIC_BASE_URL)/workflows/oauth-authorized/keycloak"
    webOrigins:
      - "/*"
    bearerOnly: false
    consentRequired: false
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: true
    authorizationServicesEnabled: true
    fullScopeAllowed: true
    frontchannelLogout: true
    surrogateAuthRequired: false
    alwaysDisplayInConsole: false
    nodeReRegistrationTimeout: -1
    notBefore: 0
    attributes:
      oidc.ciba.grant.enabled: "false"
      oauth2.device.authorization.grant.enabled: "false"
      backchannel.logout.session.required: "true"
      backchannel.logout.revoke.offline.tokens: "false"
      frontchannel.logout.session.required: "true"
      post.logout.redirect.uris: "+"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: "groups"
        protocol: "openid-connect"
        protocolMapper: "oidc-group-membership-mapper"
        consentRequired: false
        config:
          full.path: "false"
          userinfo.token.claim: "false"
          multivalued: "true"
          id.token.claim: "false"
          access.token.claim: "true"
          claim.name: "groups"
          jsonType.label: "String"
      - name: "bluecore_workflows"
        protocol: "openid-connect"
        protocolMapper: "oidc-audience-mapper"
        consentRequired: false
        config:
          included.client.audience: "bluecore_workflows"
          id.token.claim: "true"
          lightweight.claim: "false"
          introspection.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
    authorizationSettings:
      allowRemoteResourceManagement: true
      policyEnforcementMode: "ENFORCING"
      decisionStrategy: "AFFIRMATIVE"
      resources:
        - name: "Asset"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "AssetAlias"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Backfill"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Configuration"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Connection"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Custom"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Dag"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Menu"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Pool"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Team"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Variable"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "View"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "DELETE"
            - name: "GET"
            - name: "POST"
            - name: "LIST"
            - name: "PUT"
        - name: "Required Actions"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Assets"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Audit Log"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Config"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Connections"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Dags"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Docs"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Jobs"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Plugins"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Pools"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Providers"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "Variables"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
        - name: "XComs"
          ownerManagedAccess: false
          attributes: {}
          uris: []
          scopes:
            - name: "MENU"
      policies:
        - name: "Allow-Viewer"
          type: "role"
          logic: "POSITIVE"
          decisionStrategy: "UNANIMOUS"
          config:
            roles: "[{\"id\":\"bluecore_workflows/Viewer\",\"required\":false}]"
        - name: "Allow-User"
          type: "role"
          logic: "POSITIVE"
          decisionStrategy: "UNANIMOUS"
          config:
            roles: "[{\"id\":\"bluecore_workflows/User\",\"required\":false}]"
        - name: "Allow-Op"
          type: "role"
          logic: "POSITIVE"
          decisionStrategy: "UNANIMOUS"
          config:
            roles: "[{\"id\":\"bluecore_workflows/Op\",\"required\":false}]"
        - name: "Allow-Admin"
          type: "role"
          logic: "POSITIVE"
          decisionStrategy: "UNANIMOUS"
          config:
            roles: "[{\"id\":\"bluecore_workflows/Admin\",\"required\":false}]"
        - name: "Allow-SuperAdmin"
          type: "role"
          logic: "POSITIVE"
          decisionStrategy: "UNANIMOUS"
          config:
            roles: "[{\"id\":\"bluecore_workflows/SuperAdmin\",\"required\":false}]"
        - name: "ReadOnly"
          type: "scope"
          logic: "POSITIVE"
          decisionStrategy: "AFFIRMATIVE"
          config:
            scopes: "[\"LIST\",\"GET\",\"MENU\"]"
            applyPolicies: "[\"Allow-Op\",\"Allow-Viewer\",\"Allow-Admin\",\"Allow-User\"]"
        - name: "Admin"
          type: "scope"
          logic: "POSITIVE"
          decisionStrategy: "AFFIRMATIVE"
          config:
            scopes: "[\"LIST\",\"PUT\",\"POST\",\"GET\",\"DELETE\",\"MENU\"]"
            applyPolicies: "[\"Allow-Admin\",\"Allow-SuperAdmin\"]"
        - name: "User"
          type: "resource"
          logic: "POSITIVE"
          decisionStrategy: "UNANIMOUS"
          config:
            resources: "[\"Dag\",\"Asset\"]"
            applyPolicies: "[\"Allow-User\"]"
        - name: "Op"
          type: "resource"
          logic: "POSITIVE"
          decisionStrategy: "UNANIMOUS"
          config:
            resources: "[\"Backfill\",\"Pool\",\"Connection\",\"Variable\"]"
            applyPolicies: "[\"Allow-Op\"]"
      scopes:
        - name: "GET"
        - name: "POST"
        - name: "PUT"
        - name: "DELETE"
        - name: "MENU"
        - name: "LIST"

  - clientId: "bluecore_api"
    name: "Bluecore API"
    description: "For API"
    enabled: true
    protocol: "openid-connect"
    rootUrl: ""
    baseUrl: ""
    adminUrl: ""
    redirectUris:
      # Dev-only ports. These are host-local loopback URLs that cannot be
      # reached from anywhere else, so they are harmless in other environments
      # and are left literal rather than templated (this file consumes only the
      # three variables documented at the top).
      - "http://localhost:8888/*"
      - "http://localhost:8888"
      - "http://localhost:8080/oauth-authorized/keycloak"
      - "$(env:KEYCLOAK_PUBLIC_BASE_URL)/sinopia"
      - "$(env:KEYCLOAK_PUBLIC_BASE_URL)/sinopia/*"
      - "$(env:KEYCLOAK_PUBLIC_BASE_URL)/marva/util/auth/callback"
      - "$(env:KEYCLOAK_PUBLIC_BASE_URL)/api/oauth-authorized/keycloak"
    webOrigins:
      - "/*"
    bearerOnly: false
    consentRequired: false
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: false
    fullScopeAllowed: true
    frontchannelLogout: true
    surrogateAuthRequired: false
    alwaysDisplayInConsole: false
    nodeReRegistrationTimeout: -1
    notBefore: 0
    attributes:
      oidc.ciba.grant.enabled: "false"
      oauth2.device.authorization.grant.enabled: "false"
      backchannel.logout.session.required: "true"
      backchannel.logout.revoke.offline.tokens: "false"
      frontchannel.logout.session.required: "true"
      post.logout.redirect.uris: "$(env:KEYCLOAK_PUBLIC_BASE_URL)/marva/##$(env:KEYCLOAK_PUBLIC_BASE_URL)/sinopia##$(env:KEYCLOAK_PUBLIC_BASE_URL)/sinopia/*"
      display.on.consent.screen: "false"
