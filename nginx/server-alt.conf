# Second HTTPS certificate pair, for a host that is reachable under two domain
# names (e.g. staging answers on both stage.bcld.info and
# bluecore-stage.stanford.edu). nginx picks between this block and the primary
# one in nginx/server.conf by SNI, so each name is served its own certificate.
#
# The secondary name redirects to the primary rather than serving the app,
# because the browser-facing URLs in .env (KC_HOSTNAME, KEYCLOAK_EXTERNAL_URL,
# MARVA_REDIRECT_BASE, SINOPIA_BASE_URL, CORS_ORIGIN) each name a single
# origin; serving the stack under a second origin would break login there.
#
# Enable by setting these in the server's .env:
#   HOSTNAME=stage.bcld.info                        # primary / canonical
#   HOSTNAME_ALT=bluecore-stage.stanford.edu        # secondary
#   NGINX_EXTRA_SERVERS=server-alt.conf
#
# Both /etc/letsencrypt/live/${HOSTNAME} and .../${HOSTNAME_ALT} must exist on
# the host, or nginx will refuse to start.

server {
  listen 443 ssl;
  server_name ${HOSTNAME_ALT};

  ssl_certificate     /etc/letsencrypt/live/${HOSTNAME_ALT}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${HOSTNAME_ALT}/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # 301 rather than 302: the canonical origin is a deployment property, not a
  # per-request one, so it is safe for browsers and proxies to cache.
  return 301 https://${HOSTNAME}$request_uri;
}
