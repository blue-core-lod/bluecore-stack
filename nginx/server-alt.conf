# Second HTTPS certificate pair, for a host reachable under two domain names
# (staging answers on both stage.bcld.info and bluecore-stage.stanford.edu).
# nginx picks between this block and the primary one in nginx/server.conf by
# SNI, so each name is served its own certificate.
#
# This block serves the FULL stack, identical to the canonical domain: it
# includes the same site body, so /api/, /workflows/, /instances/, /works/,
# /hubs/, /profiles/, /keycloak/, /sinopia/ and /marva/ all resolve here too.
#
# Enable by setting these in the server's .env:
#   HOSTNAME=stage.bcld.info                  # canonical
#   HOSTNAME_ALT=bluecore-stage.stanford.edu  # second domain
#   NGINX_EXTRA_SERVERS=server-alt.conf
#
# Both /etc/letsencrypt/live/<HOSTNAME> and .../<HOSTNAME_ALT> must exist on the
# host, or nginx will refuse to start.
#
# CAVEAT - the browser-facing URLs in .env each name ONE origin
# (KC_HOSTNAME, KEYCLOAK_EXTERNAL_URL, MARVA_REDIRECT_BASE, SINOPIA_BASE_URL,
# CORS_ORIGIN). Proxying works on both domains, but a flow that bounces through
# one of those URLs - Keycloak login, Marva's auth callback, a browser CORS
# preflight - still lands on whichever origin they name. See
# docs/deploy.md#-two-domains-on-one-host for what to change to make logins work
# on both.

server {
  listen 443 ssl;
  server_name ${HOSTNAME_ALT};

  ssl_certificate     /etc/letsencrypt/live/${HOSTNAME_ALT}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${HOSTNAME_ALT}/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # Same routes as the canonical domain. The proxy_set_header lines in here
  # forward $host / $http_host, so upstreams see the domain the client actually
  # asked for rather than a rewritten one.
  include /etc/nginx/site-body.conf;
}

# www + plain-HTTP redirects for the SECOND domain, mirroring what
# nginx/canonical-redirects.conf does for ${HOSTNAME} (issue #94).
#
# The :80 block matters for correctness, not just parity: the one in
# canonical-redirects.conf is the default server for port 80, so without these
# names listed here http://bluecore-stage.stanford.edu would be bounced
# cross-domain to https://stage.bcld.info instead of staying on the domain the
# user typed.
#
# Same SAN caveat as the canonical domain: the ${HOSTNAME_ALT} certificate must
# list www.${HOSTNAME_ALT}, or https://www.<alt> warns before redirecting.
server {
  listen 80;
  server_name ${HOSTNAME_ALT} www.${HOSTNAME_ALT};

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://${HOSTNAME_ALT}$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name www.${HOSTNAME_ALT};

  ssl_certificate     /etc/letsencrypt/live/${HOSTNAME_ALT}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${HOSTNAME_ALT}/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  return 301 https://${HOSTNAME_ALT}$request_uri;
}
