# nginx/conf.d/site.common.conf

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  # env-specific directives go here (listen, ssl_certificate, etc)
  include /etc/nginx/conf.d/env/server.conf;

  # Request limits, error pages, and every proxy route. Shared so an extra
  # server block (below) can serve the same site under a second name.
  include /etc/nginx/site-body.conf;
}

# Optional extra env-specific server blocks — e.g. a second HTTPS certificate
# pair for a host that answers on two domains (see nginx/server-alt.conf).
# The wildcard matches nothing when no environment mounts one, which nginx
# treats as an empty include rather than an error.
include /etc/nginx/conf.d/env/extra/*.conf;
