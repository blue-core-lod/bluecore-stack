# Canonical-host redirects for ${HOSTNAME} (see GitHub issue #94).
#
# Two things happen here, both 301 permanent redirects to the naked domain:
#   1. https://www.<HOSTNAME>/...  ->  https://<HOSTNAME>/...
#   2. http://<anything>/...       ->  https://<HOSTNAME>/...
#
# Mounted unconditionally in compose.yaml as a second file in the extra-servers
# template dir, so nginx/base.conf's `include conf.d/env/extra/*.conf` picks it
# up at http context alongside the optional NGINX_EXTRA_SERVERS block.
#
# ⚠️ TLS is negotiated BEFORE the HTTP request, so the certificate at
# /etc/letsencrypt/live/${HOSTNAME}/ must list `www.${HOSTNAME}` as a SAN or the
# browser shows a name-mismatch warning before it ever sees the redirect:
#
#   certbot certonly -d ${HOSTNAME} -d www.${HOSTNAME}   # one lineage, both names
#
# Certbot keeps both names in the ${HOSTNAME} lineage, which is why this block
# reuses that directory rather than a www-specific one — pointing at a lineage
# that doesn't exist on disk would stop nginx from starting at all. DNS must
# also resolve www.${HOSTNAME} to this host.

# Plain HTTP. Nothing else listens on :80 in compose.yaml, so this is the
# default server for the port and catches the naked domain, the www name, and
# requests that arrive with an unrecognized Host (e.g. by IP).
server {
  listen 80 default_server;
  server_name ${HOSTNAME} www.${HOSTNAME};

  # Served before the redirect so an HTTP-01 renewal still works while the
  # stack is up: `certbot certonly --webroot -w ./nginx -d ...` writes into the
  # repo's nginx/ directory, which is bind-mounted at /var/www/html.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://${HOSTNAME}$request_uri;
  }
}

# https://www.<HOSTNAME> -> https://<HOSTNAME>. Same certificate pair as the
# canonical block in nginx/server.conf (see the SAN note above).
server {
  listen 443 ssl;
  server_name www.${HOSTNAME};

  ssl_certificate     /etc/letsencrypt/live/${HOSTNAME}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${HOSTNAME}/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # $request_uri keeps the path and query string intact. It survives the
  # entrypoint's envsubst pass because only defined env var names are
  # substituted, and nginx variables aren't env vars.
  return 301 https://${HOSTNAME}$request_uri;
}
