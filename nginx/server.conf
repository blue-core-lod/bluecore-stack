# default_server keeps this block answering requests that arrive without SNI
# or with an unrecognized Host, which matters once a second 443 block exists
# (nginx/server-alt.conf) — otherwise nginx would pick whichever block came
# first in the config.
listen 443 ssl default_server;

# HOSTNAME is substituted from the container's env var via nginx's
# envsubst-on-templates entrypoint step. It names both the canonical domain and
# its /etc/letsencrypt/live/<HOSTNAME> certificate directory.
server_name ${HOSTNAME};

ssl_certificate     /etc/letsencrypt/live/${HOSTNAME}/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/${HOSTNAME}/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
