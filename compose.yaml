include:
  - compose-base.yaml

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.1.2}
    expose:
      - 8080
      - 8443
    env_file:
      - ./.env
    environment:
      KC_DB_URL: jdbc:postgresql://${DATABASE_HOSTNAME:-postgres}:${DATABASE_PORT:-5432}/keycloak
      KC_DB_USERNAME: ${DATABASE_USERNAME:-airflow}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD:-airflow}
      # Keycloak defaults this to 100, which on its own exceeds a PgBouncer
      # pool's server connections and starves every other client of the
      # keycloak database. Hibernate needs session-level state (server-side
      # prepared statements), so this pool has to be served in session pooling
      # mode, where each held connection pins a server connection for its whole
      # life - keep this at or below the pool_size PgBouncer gives the keycloak
      # database.
      KC_DB_POOL_MAX_SIZE: ${KEYCLOAK_DB_POOL_MAX_SIZE:-20}
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<> /dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: http://localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi;" ]
      interval: 10s
      timeout: 10s
      retries: 20
    command:
      - start
      - --import-realm
    volumes:
      # Mounts the whole dir for import.
      # KEYCLOAK_REALM_DIR selects it per environment; defaults to production.
      # Set it in the server's .env for staging ( e.g. KEYCLOAK_REALM_DIR=./keycloak-export/staging).
      # An empty dir simply imports nothing. Seed <KEYCLOAK_REALM_DIR>/bluecore-realm.json beforethe first start.
      # "./scripts/export-keycloak-realm.sh --env=<env>" writes to it.
      - ${KEYCLOAK_REALM_DIR:-./keycloak-export/production}:/opt/keycloak/data/import
      - ${KEYCLOAK_REALM_DIR:-./keycloak-export/production}:/opt/keycloak/data/export

  nginx:
    image: nginx:1.27.4-alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - keycloak
      - airflow-apiserver
    environment:
      # Must match the /etc/letsencrypt/live/<HOSTNAME> cert directory.
      - HOSTNAME=${HOSTNAME}
      # Second domain for hosts reachable under two names (staging answers on
      # both stage.bcld.info and bluecore-stage.stanford.edu). Only read when
      # NGINX_EXTRA_SERVERS is set; must match its own cert directory.
      - HOSTNAME_ALT=${HOSTNAME_ALT:-}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/base.conf:/etc/nginx/conf.d/default.conf
      # Outside conf.d/ on purpose: base.conf includes it from inside its
      # server block, and conf.d/*.conf is loaded at http context.
      - ./nginx/site-body.conf:/etc/nginx/site-body.conf
      - ./nginx/server.conf:/etc/nginx/templates/env/server.conf.template
      # Extra server blocks, selected per host in .env. Unset means the
      # comment-only placeholder, i.e. a single domain (production).
      # Set NGINX_EXTRA_SERVERS=server-alt.conf for a second cert pair.
      - ./nginx/${NGINX_EXTRA_SERVERS:-no-extra-servers.conf}:/etc/nginx/templates/env/extra/extra.conf.template
      - ./nginx:/var/www/html
    restart: always
